<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark</title>
<style>
  :root {
    --bg: #F6F7F9;
    --surface: #FFFFFF;
    --line: #E3E6EB;
    --text: #15181E;
    --muted: #677080;
    --btn: #15181E;
    --btn-text: #FFFFFF;
    --stopped: #A3AAB6;
    --idle: #FF5A1F;
    --listening: #10B981;
    --thinking: #8B5CF6;
    --speaking: #0EA5E9;
    --confirming: #EAB308;
    --error: #EF4444;
    --level: 0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --surface: #1A1D24;
      --line: #2A2F39;
      --text: #ECEEF2;
      --muted: #9199A8;
      --btn: #ECEEF2;
      --btn-text: #111318;
      --stopped: #5B6371;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 18px 20px 20px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  .name { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
  .pill {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 999px; display: flex; align-items: center; gap: 6px;
  }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--stopped)); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .iconbtn {
    appearance: none; width: 28px; height: 28px; padding: 0; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .iconbtn:hover { color: var(--text); background: var(--surface); }
  .iconbtn svg { width: 16px; height: 16px; }
  .iconbtn .off { display: none; }
  .iconbtn.muted { color: #fff; background: var(--confirming); border-color: var(--confirming); }
  .iconbtn.muted .on { display: none; }
  .iconbtn.muted .off { display: block; }

  /* --- orb ---------------------------------------------------------------------------------- */
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
  .orb { --c: var(--stopped); position: relative; width: 184px; height: 184px; display: grid; place-items: center; }
  .orb > * { position: absolute; border-radius: 50%; }
  .halo {
    inset: 22px; background: var(--c); opacity: 0;
    transform: scale(calc(1 + var(--level) * .42));
    transition: opacity .3s, background-color .4s;
  }
  .ripple { inset: 34px; border: 2px solid var(--c); opacity: 0; }
  .spin {
    inset: 26px; opacity: 0;
    background: conic-gradient(from 0deg, transparent 0 62%, var(--c) 100%);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%);
            mask: radial-gradient(circle, transparent 62%, #000 63%);
  }
  .core {
    inset: 38px; background: var(--c); display: grid; place-items: center;
    box-shadow: 0 10px 30px -10px var(--c);
    transition: background-color .4s, box-shadow .4s, transform .3s;
  }
  .core svg { width: 40px; height: 40px; color: #fff; opacity: .95; }
  .core .off { display: none; }

  .orb[data-mode="stopped"] .core { box-shadow: none; }
  .orb[data-mode="stopped"] .core .on { display: none; }
  .orb[data-mode="stopped"] .core .off { display: block; }
  .orb[data-mode="starting"] { --c: var(--idle); }
  .orb[data-mode="starting"] .core { opacity: .55; }
  .orb[data-mode="starting"] .spin { opacity: 1; animation: spin 1.4s linear infinite; }
  .orb[data-mode="idle"] { --c: var(--idle); }
  .orb[data-mode="idle"] .core { animation: breathe 3.2s ease-in-out infinite; }
  .orb[data-mode="idle"] .halo { opacity: .16; }
  .orb[data-mode="listening"] { --c: var(--listening); }
  .orb[data-mode="listening"] .halo { opacity: .24; }
  .orb[data-mode="listening"] .core { transform: scale(1.06); }
  .orb[data-mode="listening"] .ripple { animation: ripple 1.6s ease-out infinite; }
  .orb[data-mode="thinking"] { --c: var(--thinking); }
  .orb[data-mode="thinking"] .spin { opacity: 1; animation: spin 1s linear infinite; }
  .orb[data-mode="speaking"] { --c: var(--speaking); }
  .orb[data-mode="speaking"] .ripple { animation: ripple 1.8s ease-out infinite; }
  .orb[data-mode="confirming"] { --c: var(--confirming); }
  .orb[data-mode="confirming"] .halo { opacity: .24; }
  .orb[data-mode="confirming"] .core { animation: breathe 1.4s ease-in-out infinite; }
  .orb[data-mode="error"] { --c: var(--error); }
  .orb[data-mode="muted"] { --c: var(--confirming); }
  .orb[data-mode="muted"] .core { opacity: .5; box-shadow: none; }
  .orb[data-mode="muted"] .core .on { display: none; }
  .orb[data-mode="muted"] .core .off { display: block; }
  .ripple.r2 { animation-delay: .8s !important; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(1.045); } }
  @keyframes ripple { from { transform: scale(1); opacity: .55; } to { transform: scale(1.7); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .orb * { animation: none !important; }
  }

  .label { margin-top: 18px; font-size: 20px; font-weight: 600; text-align: center; }
  .detail { margin-top: 4px; color: var(--muted); text-align: center; min-height: 20px; max-width: 290px; overflow-wrap: anywhere; }
  .detail.err { color: var(--error); user-select: text; -webkit-user-select: text; }

  /* --- last exchange ------------------------------------------------------------------------ */
  .exchange {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; display: grid; gap: 6px; margin: 14px 0 12px; min-height: 64px;
    user-select: text; -webkit-user-select: text;
  }
  .row { display: grid; grid-template-columns: 58px 1fr; gap: 8px; }
  .who { color: var(--muted); font-size: 12px; padding-top: 1px; }
  .said {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .empty { color: var(--muted); font-size: 13px; align-self: center; text-align: center; }
  /* --- model choice ------------------------------------------------------------------------ */
  .model { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; border-radius: 0; height: 26px; width: auto; padding: 0 10px;
    background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; }
  .linkbtn {
    appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px;
    width: auto; height: auto; padding: 2px 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px;
  }
  .linkbtn:hover { color: var(--text); }
  .models { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .models select {
    font: inherit; font-size: 12px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0;
  }
  .toast { color: var(--error); font-size: 12px; min-height: 18px; margin: -4px 0 6px; text-align: center; }
  .toast.soft { color: var(--muted); }

  button {
    appearance: none; border: 0; border-radius: 999px; height: 46px; width: 100%;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--btn); color: var(--btn-text);
    transition: opacity .2s, transform .08s;
  }
  button:active { transform: scale(.985); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--idle); outline-offset: 3px; }
  button.stop { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
</style>
</head>
<body>
  <header>
    <span class="name" id="name">Spark</span>
    <span class="tools">
      <span class="pill"><i id="dot"></i><span id="pill">Off</span></span>
      <button class="iconbtn" id="mute" type="button" title="Mute: stop listening (Ctrl+M)" aria-label="Mute" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
        </svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M5.5 11a6.5 6.5 0 0 0 10.7 5M18.4 12.6c.1-.5.1-1 .1-1.6M12 17.5V21M3 3l18 18"/>
        </svg>
      </button>
      <button class="iconbtn" id="shortcuts" type="button" title="Voice shortcuts" aria-label="Shortcuts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z"/>
        </svg>
      </button>
      <button class="iconbtn" id="voice" type="button" title="Personality and voice: how Spark talks" aria-label="Personality and voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>
        </svg>
      </button>
      <button class="iconbtn" id="brain" type="button" title="Brain: which AI thinks for Spark, its key and models" aria-label="Brain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4.5a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 4.5 3 3 0 0 0 3 2.5 3 3 0 0 0 3-3V7a2.5 2.5 0 0 0-3-2.5ZM15 4.5a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 4.5 3 3 0 0 1-3 2.5 3 3 0 0 1-3-3"/>
        </svg>
      </button>
      <button class="iconbtn" id="connectors" type="button" title="Connectors (MCP servers)" aria-label="Connectors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7ZM12 16v5"/>
        </svg>
      </button>
    </span>
  </header>
  <div class="model">
    <div class="seg" id="mode" role="group" aria-label="Model">
      <button type="button" data-mode="auto" aria-pressed="true" title="Quick questions on the fast model, bigger ones on the deep model">Auto</button>
      <button type="button" data-mode="fast" aria-pressed="false" title="Every request on the fast model">Fast</button>
      <button type="button" data-mode="deep" aria-pressed="false" title="Every request on the deep model">Deep</button>
    </div>
    <button class="linkbtn" id="modelsBtn" type="button" title="Choose the models">Models</button>
  </div>
  <div class="models" id="models" hidden>
    <label for="fastSel">Fast</label><select id="fastSel"></select>
    <label for="deepSel">Deep</label><select id="deepSel"></select>
    <label for="workerSel" title="Does multi-step lookups in your connectors for the voice model">Research</label><select id="workerSel"></select>
  </div>

  <main>
    <div class="orb" id="orb" data-mode="stopped" aria-hidden="true">
      <div class="halo"></div>
      <div class="ripple"></div>
      <div class="ripple r2"></div>
      <div class="spin"></div>
      <div class="core">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
        </svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M5.5 11a6.5 6.5 0 0 0 10.7 5M18.4 12.6c.1-.5.1-1 .1-1.6M12 17.5V21M3 3l18 18"/>
        </svg>
      </div>
    </div>
    <div class="label" id="label" role="status" aria-live="polite">Stopped</div>
    <div class="detail" id="detail"></div>
  </main>

  <section class="exchange" id="exchange">
    <div class="empty" id="empty">Your last question and the reply show up here.</div>
    <div class="row" id="rowUser" hidden><span class="who">You</span><span class="said" id="user"></span></div>
    <div class="row" id="rowReply" hidden><span class="who" id="replyWho">Spark</span><span class="said" id="reply"></span></div>
  </section>
  <div class="toast" id="toast"></div>
  <button id="toggle" type="button">Start</button>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const S = { phase: "stopped", state: null, detail: "", name: "Spark", wake: "Hey Spark", target: 0, shown: 0, awakeUntil: 0,
              model: null, choices: [], down: [], muted: false };
  let toastTimer = null;

  const STATE_TEXT = {
    idle:       () => [`Say “${S.wake}”`, "Asleep · listening only for the wake word"],
    listening:  () => ["Listening…", "Go ahead, I'm all ears"],
    follow_up:  () => [awakeLabel(), `Just talk, no need to say “${S.wake}”`],
    thinking:   () => ["Thinking…", ""],
    speaking:   () => ["Speaking", ""],
    confirming: () => ["Yes or no?", "Say yes to go ahead, or no to cancel"],
  };
  const MODE = { follow_up: "listening" };

  function awakeLabel() {
    const left = Math.max(0, Math.round((S.awakeUntil - Date.now()) / 1000));
    if (!S.awakeUntil) return "Awake";
    return `Awake · ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  }

  function render() {
    let mode, label, detail, pill, btn;
    if (S.phase === "running" && S.state && S.muted && ["idle", "follow_up", "listening"].includes(S.state)) {
      mode = "muted"; label = "Muted";
      detail = "Not listening. Click the mic or press Ctrl+M to unmute.";
      pill = "Muted"; btn = "Stop";
    } else if (S.phase === "running" && S.state) {
      mode = MODE[S.state] || S.state;
      [label, detail] = (STATE_TEXT[S.state] || (() => [S.state, ""]))();
      if (S.muted) detail = "Mic muted · finishing what it was doing";
      pill = S.muted ? "Muted" : "On"; btn = "Stop";
    } else if (S.phase === "starting") {
      mode = "starting"; label = "Starting…"; detail = S.detail; pill = "Starting"; btn = "Starting…";
    } else if (S.phase === "error") {
      mode = "error"; label = "Couldn't start"; detail = S.detail; pill = "Error"; btn = "Try again";
    } else {
      mode = "stopped"; label = "Stopped"; pill = "Off"; btn = "Start";
      detail = S.detail || `Press Start, then say “${S.wake}”`;
    }
    $("orb").dataset.mode = mode;
    $("label").textContent = label;
    $("detail").textContent = detail || "";
    $("detail").classList.toggle("err", S.phase === "error");
    $("pill").textContent = pill;
    $("dot").style.setProperty("--c", `var(--${mode === "starting" ? "idle" : mode === "muted" ? "confirming" : mode})`);
    $("mute").classList.toggle("muted", S.muted);
    $("mute").setAttribute("aria-pressed", String(S.muted));
    $("mute").title = S.muted ? "Unmute: listen again (Ctrl+M)" : "Mute: stop listening (Ctrl+M)";
    const b = $("toggle");
    b.textContent = btn;
    b.disabled = S.phase === "starting";
    b.classList.toggle("stop", S.phase === "running");
    document.title = S.name;
  }

  function renderModel() {
    const m = S.model;
    if (!m) return;
    document.querySelectorAll("#mode button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m.mode)));
    const names =
      m.mode === "fast" ? m.fast_label : m.mode === "deep" ? `${m.deep_label} + ${m.worker_label}` : `${m.fast_label} · ${m.deep_label}`;
    $("modelsBtn").textContent = m.provider ? `${m.provider} · ${names}` : names;
    $("modelsBtn").title = m.provider ? `Brain: ${m.provider}. Choose the models` : "Choose the models";
    fill($("fastSel"), m.fast_model);
    fill($("deepSel"), m.deep_model);
    fill($("workerSel"), m.worker_model || "", [["", `Same as Fast (${m.fast_label})`]]);
  }

  function fill(sel, current, extra) {
    const choices = [...(extra || []), ...S.choices];
    const key = JSON.stringify(choices);
    if (sel.dataset.key !== key) {
      sel.dataset.key = key;
      sel.textContent = "";
      for (const [id, label] of choices) {
        const o = document.createElement("option");
        o.value = id; o.textContent = label;
        sel.appendChild(o);
      }
    }
    sel.value = current;
  }

  function say(role, text) {
    $("empty").hidden = true;
    if (role === "user") {
      $("rowUser").hidden = false; $("user").textContent = text;
      $("rowReply").hidden = true; $("reply").textContent = "";
    } else {
      $("rowReply").hidden = false; $("reply").textContent = text;
    }
  }

  function toast(msg, soft) {
    $("toast").textContent = msg;
    $("toast").classList.toggle("soft", !!soft);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").textContent = ""; }, 8000);
  }

  function applyOne(e) {
    switch (e.type) {
      case "phase":
        S.phase = e.phase; S.detail = e.detail || "";
        if (e.phase !== "running") { S.state = null; S.target = 0; }
        break;
      case "state":
        S.state = e.state;
        if (e.state === "follow_up") S.awakeUntil = e.awake_s != null ? Date.now() + e.awake_s * 1000 : 0;
        else if (e.state === "idle") S.awakeUntil = 0;
        break;
      case "ignored": toast("That didn't sound like it was for me", true); break;
      case "model": if (e.choices) S.choices = e.choices; S.model = e; renderModel(); break;
      case "muted": S.muted = !!e.muted; if (S.muted) S.target = 0; break;
      case "connectors": {
        const down = Object.entries(e.status || {}).filter(([, v]) => v.status === "failed" || v.status === "needs-auth").map(([k]) => k);
        const fresh = down.filter((k) => !S.down.includes(k));
        S.down = down;
        if (fresh.length) toast(`${fresh.join(" and ")} ${fresh.length > 1 ? "aren't" : "isn't"} reachable right now`, true);
        break;
      }
      case "transcript": say(e.role, e.text); break;
      case "level": S.target = e.level; break;
      case "error": toast(e.message); break;
    }
  }

  window.spark = {
    apply(events) { events.forEach(applyOne); render(); },
  };

  // Smooth the mic level (events arrive ~15/s) into the halo size.
  let lastSecond = -1;
  function tick() {
    if (S.state === "follow_up" && S.awakeUntil) {
      const sec = Math.floor(Date.now() / 1000);
      if (sec !== lastSecond) { lastSecond = sec; $("label").textContent = awakeLabel(); }
    }
    S.shown += (S.target - S.shown) * 0.22;
    if (Math.abs(S.shown) < 0.002) S.shown = 0;
    $("orb").style.setProperty("--level", S.shown.toFixed(3));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  $("toggle").addEventListener("click", () => {
    if (!window.pywebview) return;
    if (S.phase === "running") {
      window.pywebview.api.stop();
    } else if (S.phase !== "starting") {
      S.phase = "starting"; S.detail = ""; $("toast").textContent = ""; render();
      window.pywebview.api.start();
    }
  });

  $("connectors").addEventListener("click", () => {
    if (window.pywebview) window.pywebview.api.connectors();
  });

  $("brain").addEventListener("click", () => {
    if (window.pywebview) window.pywebview.api.brain();
  });

  $("voice").addEventListener("click", () => {
    if (window.pywebview) window.pywebview.api.voice();
  });

  $("shortcuts").addEventListener("click", () => {
    if (window.pywebview) window.pywebview.api.shortcuts();
  });

  document.querySelectorAll("#mode button").forEach((b) => b.addEventListener("click", () => {
    if (!window.pywebview || !S.model) return;
    S.model = { ...S.model, mode: b.dataset.mode };  // shown at once; the event confirms it
    renderModel();
    window.pywebview.api.set_mode(b.dataset.mode);
  }));

  $("modelsBtn").addEventListener("click", () => { $("models").hidden = !$("models").hidden; });

  function toggleMute() {
    if (!window.pywebview) return;
    S.muted = !S.muted;  // shown at once; the event confirms it
    if (S.muted) S.target = 0;
    render();
    window.pywebview.api.set_muted(S.muted);
  }
  $("mute").addEventListener("click", toggleMute);
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === "m" || e.key === "M")) { e.preventDefault(); toggleMute(); }
  });

  const pickModels = () => {
    if (window.pywebview) window.pywebview.api.set_models($("fastSel").value, $("deepSel").value, $("workerSel").value);
  };
  $("fastSel").addEventListener("change", pickModels);
  $("deepSel").addEventListener("change", pickModels);
  $("workerSel").addEventListener("change", pickModels);

  window.addEventListener("pywebviewready", async () => {
    const snap = await window.pywebview.api.snapshot();
    S.name = snap.name || S.name;
    S.wake = snap.wake || S.name;
    $("name").textContent = S.name;
    $("replyWho").textContent = S.name;
    if (S.phase !== "starting" || snap.phase !== "stopped") { S.phase = snap.phase; }
    S.state = snap.state;
    S.muted = !!snap.muted;
    if (snap.awake_s != null) S.awakeUntil = Date.now() + snap.awake_s * 1000;
    S.choices = snap.model_choices || [];
    S.model = snap.model || null;
    renderModel();
    render();
  });

  render();
})();
</script>
